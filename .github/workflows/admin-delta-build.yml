name: Admin Selected Delta Packages
run-name: delta:${{ inputs.job_id }}:${{ inputs.attempt }}
on:
  push:
    branches: ["dev/admin/version-inventory-*"]
  workflow_dispatch:
    inputs:
      job_id:
        description: "Immutable job ID issued by the original Admin"
        type: string
        required: true
      attempt:
        description: "Exact Admin attempt; use Admin retry instead of GitHub rerun"
        type: string
        required: true
      kind:
        type: choice
        options: [firmware]
        required: true
permissions:
  contents: read
concurrency:
  group: admin-delta-${{ inputs.job_id || github.ref }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: "1"
  NODE_DISABLE_COMPILE_CACHE: "1"
  npm_config_cache: ${{ github.workspace }}/.cache/admin-delta/npm
  PIP_CACHE_DIR: ${{ github.workspace }}/.cache/admin-delta/pip
  TMPDIR: ${{ github.workspace }}/.cache/admin-delta/tmp
  TMP: ${{ github.workspace }}/.cache/admin-delta/tmp
  TEMP: ${{ github.workspace }}/.cache/admin-delta/tmp
  XDG_CACHE_HOME: ${{ github.workspace }}/.cache/admin-delta/cache
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Prepare contained caches
        run: mkdir -p "$TMPDIR" "$PIP_CACHE_DIR" "$XDG_CACHE_HOME"
      - name: Verify delta orchestration
        run: node --test tests/ota/test_admin_delta_job.mjs
      - name: Install locked backend dependencies
        run: npm ci --prefix app/bluetooth_flutter_Trace/cloudflare/update-service/worker
      - name: Typecheck and test the real Workers runtime
        run: |
          npm run check --prefix app/bluetooth_flutter_Trace/cloudflare/update-service/worker
          npm test --prefix app/bluetooth_flutter_Trace/cloudflare/update-service/worker
  firmware:
    if: github.event_name == 'workflow_dispatch' && inputs.kind == 'firmware'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: firmware-rehearsal
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install existing isolated packaging tools
        run: |
          mkdir -p "$TMPDIR" "$PIP_CACHE_DIR"
          python3 -m pip install --only-binary=:all: --disable-pip-version-check --target .cache/admin-delta/python pycryptodome==3.23.0
          cmake -S .github/scripts/bsdiff -B .cache/admin-delta/bsdiff -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build .cache/admin-delta/bsdiff --target bsdiff
      - name: Generate from original ETU packages, verify and append a disabled delta
        id: generate
        env:
          INPUT_JOB_ID: ${{ inputs.job_id }}
          INPUT_ATTEMPT: ${{ inputs.attempt }}
          INPUT_KIND: firmware
          PYTHONPATH: ${{ github.workspace }}/.cache/admin-delta/python
          BSDIFF_EXE: ${{ github.workspace }}/.cache/admin-delta/bsdiff/bin/bsdiff
          OTA_AES_KEY: ${{ secrets.FIRMWARE_REHEARSAL_OTA_AES_KEY }}
          TRACE_DEPLOY_TOKEN: ${{ secrets.ORIGINAL_ADMIN_FIRMWARE_DEPLOY_TOKEN }}
          TRACE_UPDATE_SERVICE_URL: https://trace-update-service-staging.tangjichentudou.workers.dev
        run: node app/bluetooth_flutter_Trace/cloudflare/update-service/scripts/generate-delta-job.mjs --out .cache/admin-delta/run
      - name: Preserve attempt receipts, excluding unpacked firmware
        if: always() && steps.generate.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: admin-delta-firmware-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .cache/admin-delta/run/*.json
            .cache/admin-delta/run/*.stdout
            .cache/admin-delta/run/*.stderr
            .cache/admin-delta/run/patch
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
