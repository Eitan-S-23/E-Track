name: MCU Firmware Build

# 单片机固件 GCC 构建工作流（monorepo 路径隔离）：
# - push 到 main/master 且固件相关路径变更 → 仅构建 + 上传 Actions artifact（14 天；不建 Release、不注册 CF）
# - workflow_dispatch(rehearsal=true): isolated staging, never GitHub Release
# - workflow_dispatch(publish=true): approved rehearsal rebuild and production gate
# - workflow_dispatch(check_bindings=true): protected existing-object readback, not rehearsal
# - 仅固件路径触发本工作流；Flutter 侧由 build.yml 的 changes job 隔离，互不触发
# - 正式发布后在 CF admin 端将候选晋升为 stable 渠道当前版本
# mcu-firmware-release.yml is an out-of-scope legacy consumer, not a v2 fallback.

on:
  push:
    branches:
      - main
      - master
    paths:
      - "USER/**"
      - "ArduinoAPI/**"
      - "Libraries/**"
      - "MDK-ARM_F435/**"
      - "boot/**"
      - "cmake/**"
      - "tests/boot/**"
      - "tests/ota/test_ota_*.c"
      - "tests/ota/test_ota_*.py"
      - "tests/ota/test_sdio_command_timeouts.py"
      - "tests/ota/p3_1_verify_contract_alignment.py"
      - "tests/ota/p3_1_verify_text_isolation.py"
      - "tests/ota/p3_1_verify_portability.py"
      - "tests/ota/stubs/**"
      - "tests/ota-vectors/**"
      - "vendor/**"
      - "Simulator/LVGL.Simulator/lv_conf.h"
      - ".github/workflows/firmware-build.yml"
      - ".github/scripts/firmware-*"
      - ".github/scripts/bsdiff/**"
      - ".github/scripts/p41-host.config.mjs"
      - "Tools/etu_pack.py"
      - "Tools/etu_unpack.py"
      - "Tools/jlink/prepare-bootstrap-app.py"
      - "tests/ota/*firmware*"
      - "app/bluetooth_flutter_Trace/cloudflare/update-service/scripts/*firmware*"
  pull_request:
    branches:
      - main
      - master
    paths:
      - "USER/**"
      - "ArduinoAPI/**"
      - "Libraries/**"
      - "MDK-ARM_F435/**"
      - "boot/**"
      - "cmake/**"
      - "tests/boot/**"
      - "tests/ota/test_ota_*.c"
      - "tests/ota/test_ota_*.py"
      - "tests/ota/test_sdio_command_timeouts.py"
      - "tests/ota/p3_1_verify_contract_alignment.py"
      - "tests/ota/p3_1_verify_text_isolation.py"
      - "tests/ota/p3_1_verify_portability.py"
      - "tests/ota/stubs/**"
      - "tests/ota-vectors/**"
      - "vendor/**"
      - "Simulator/LVGL.Simulator/lv_conf.h"
      - ".github/workflows/firmware-build.yml"
      - ".github/scripts/firmware-*"
      - ".github/scripts/bsdiff/**"
      - ".github/scripts/p41-host.config.mjs"
      - "Tools/etu_pack.py"
      - "Tools/etu_unpack.py"
      - "Tools/jlink/prepare-bootstrap-app.py"
      - "tests/ota/*firmware*"
      - "app/bluetooth_flutter_Trace/cloudflare/update-service/scripts/*firmware*"
  workflow_dispatch:
    inputs:
      publish:
        description: "构建成功后创建 GitHub Release 并注册 Cloudflare 正式候选"
        required: true
        type: boolean
        default: false
      rehearsal:
        description: "Use approved isolated staging bindings; never create a GitHub Release"
        required: true
        type: boolean
        default: false
      check_bindings:
        description: "Qualify protected isolated R2/D1 runtime using existing objects only; not rehearsal"
        required: true
        type: boolean
        default: false
      approved_rehearsal_run_id:
        description: "Production only: independently approved rehearsal provenance run id"
        required: false
        type: string
      version_name:
        description: "固件版本名（如 2.8.0）；正式链留空须源码已有三段版本，非发布检查兼容两段版本"
        required: false
        type: string
      release_notes:
        description: "发布说明（app/admin 展示）"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: firmware-build-${{ github.event_name == 'workflow_dispatch' && (inputs.publish || inputs.rehearsal || inputs.check_bindings) && 'release' || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' || (!inputs.publish && !inputs.rehearsal && !inputs.check_bindings) }}

env:
  DEVICE_MODEL: e-track-at32f435
  TARGET_HARDWARE: AT32F435RGT7
  CMAKE_PROJECT_DIR: MDK-ARM_F435/cmake-generated
  # Short build tree avoids CMAKE_OBJECT_PATH_MAX warnings on Linux runners.
  BUILD_DIR: ${{ github.workspace }}/.cache/etfw
  BUILD_TYPE: Release
  SOURCE_DATE_EPOCH: "1786320000"

jobs:
  release-development-checks:
    name: Release tooling development checks (no cloud credentials)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      WRANGLER_SEND_METRICS: "false"
      WRANGLER_LOG_PATH: ${{ github.workspace }}/.cache/p41/wrangler-logs
      npm_config_cache: ${{ github.workspace }}/.cache/p41/npm
      PIP_CACHE_DIR: ${{ github.workspace }}/.cache/p41/pip
      TMPDIR: ${{ github.workspace }}/.cache/p41/tmp
      PYTHONDONTWRITEBYTECODE: "1"
      BSDIFF_EXE: ${{ github.workspace }}/.cache/bsdiff/bin/bsdiff
    defaults:
      run:
        working-directory: app/bluetooth_flutter_Trace/cloudflare/update-service/worker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Prepare contained test temporary directory
        run: mkdir -p "$TMPDIR"
      - name: Install pinned Worker dependencies
        run: npm ci --registry=https://registry.npmjs.org --replace-registry-host=always
      - name: Run script and migration host tests explicitly (not workerd)
        run: npm test -- --config test/vitest.host.config.ts test/firmware-scripts.host.test.ts test/firmware-migration.host.test.ts
      - name: Run release pipeline with real handlers and SQLite host ports (not rehearsal)
        run: npm test -- --config ../../../../../.github/scripts/p41-host.config.mjs
      - name: Run native workerd D1 R2 and registration invariants (not host doubles)
        run: npm test -- --reporter=verbose
      - name: Check Worker and shared script types
        run: npm run check
      - name: Build tested Worker deployment input without cloud access
        id: worker_bundle
        env:
          HOME: ${{ github.workspace }}/.cache/p41/worker-home
          XDG_CONFIG_HOME: ${{ github.workspace }}/.cache/p41/worker-config
          XDG_CACHE_HOME: ${{ github.workspace }}/.cache/p41/worker-cache
          CLOUDFLARE_API_TOKEN: ""
          CLOUDFLARE_ACCOUNT_ID: ""
        run: |
          set -euo pipefail
          node node_modules/wrangler/bin/wrangler.js deploy --dry-run --outdir "$GITHUB_WORKSPACE/.cache/p41-worker-bundle"
          printf '%s\n' "$GITHUB_SHA" > "$GITHUB_WORKSPACE/.cache/p41-worker-bundle/source-commit.txt"
          printf '%s\n' 'Build-only input; no deployment or rehearsal performed.' > "$GITHUB_WORKSPACE/.cache/p41-worker-bundle/purpose.txt"
      - name: Install byte test dependency
        run: python3 -m pip install --disable-pip-version-check pycryptodome==3.23.0 PyYAML==6.0.3
      - name: Build the existing vendor bsdiff for this host
        working-directory: .
        run: |
          cmake -S .github/scripts/bsdiff -B .cache/bsdiff -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build .cache/bsdiff --target bsdiff
      - name: Check real package generation and approved-envelope replay
        working-directory: .
        run: |
          python3 -B tests/ota/test_firmware_pack.py
          PYTHONPATH="$GITHUB_WORKSPACE/Tools" python3 -B tests/ota-vectors/test_vectors.py
      - name: Check workflow execution graph and configuration gates
        working-directory: .
        run: node --test tests/ota/test_firmware_workflow.mjs
      - name: Execute production byte preparation with isolated fixtures
        id: byte_tests
        working-directory: .
        run: node --test tests/ota/test_firmware_release.mjs
      - name: Preserve development byte fixtures and step originals
        if: always() && steps.byte_tests.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: p41-development-${{ github.sha }}
          path: |
            .cache/firmware-release-tests/
            .cache/firmware-pipeline-tests/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
      - name: Preserve tested Worker deployment input
        if: success() && steps.worker_bundle.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: p41-worker-bundle-${{ github.sha }}
          path: .cache/p41-worker-bundle/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

  build:
    name: Build firmware (arm-none-eabi-gcc)
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      build_number: ${{ steps.version.outputs.build_number }}
      sha256: ${{ steps.artifacts.outputs.sha256 }}
      bin_size: ${{ steps.artifacts.outputs.bin_size }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node for shared release helpers
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Contain build temporary and pip cache paths
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.cache/build-tmp"
          echo "TMPDIR=$GITHUB_WORKSPACE/.cache/build-tmp" >> "$GITHUB_ENV"
          echo "PIP_CACHE_DIR=$GITHUB_WORKSPACE/.cache/build-pip" >> "$GITHUB_ENV"

      - name: Install Arm GNU Toolchain 13.3.Rel1
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: "13.3.Rel1"

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install OTA host test dependencies
        run: python3 -m pip install --disable-pip-version-check pycryptodome==3.23.0

      - name: Verify reproducible GCC timestamps
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          ARM_GCC: arm-none-eabi-gcc
        run: |
          set -euo pipefail
          python3 tests/ota/test_ota_gcc_reproducibility.py

      - name: Extract firmware version
        id: version
        shell: bash
        env:
          INPUT_VERSION_NAME: ${{ github.event.inputs.version_name }}
          INPUT_PUBLISH: ${{ github.event.inputs.publish }}
          INPUT_REHEARSAL: ${{ github.event.inputs.rehearsal }}
        run: |
          set -euo pipefail

          # 版本名：手动输入优先，否则取 Version.h 的 VERSION_SOFTWARE（去 v 前缀）
          base_version="$(sed -n 's/^#define VERSION_SOFTWARE\s*"v\?\([^"]*\)"/\1/p' USER/App/Version.h | head -n1)"
          if [[ -z "${base_version}" ]]; then
            echo "::error title=Version missing::USER/App/Version.h VERSION_SOFTWARE not found"
            exit 1
          fi
          build_number="$(git rev-list --count HEAD)"
          if [[ -n "${INPUT_VERSION_NAME:-}" ]]; then
            version_name="${INPUT_VERSION_NAME}"
          else
            version_name="${base_version}"
            # Only a trusted legacy source label in checks may acquire a zero
            # patch. Formal inputs must already be canonical, never inferred.
            if [[ "${INPUT_PUBLISH:-false}" != "true" && "${INPUT_REHEARSAL:-false}" != "true" && "${base_version}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]?)$ ]]; then
              version_name="${base_version}.0"
            fi
          fi

          # version_code = major*10000 + minor*100 + patch (u32; PRE-1 / PLAN-OTA.md §3.1)
          # Examples: 2.8.0→20800, 2.8.1→20801; legacy old-formula 2007(v2.7) < 20700(2.7.0).
          # Encode from the effective release name so version_name and version_code cannot diverge.
          encode_src="${version_name}"
          if [[ ! "${encode_src}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]?)\.(0|[1-9][0-9]?)$ ]]; then
            echo "::error title=Invalid version::version_name must contain three canonical version components"
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          # Bound digit length before arithmetic to prevent signed Bash wrap.
          if (( ${#major} > 6 )) || (( 10#${major} > 429496 )); then
            echo "::error title=Invalid version::version_code overflows u32 for ${version_name}"
            exit 1
          fi
          if (( 10#${minor} > 99 || 10#${patch} > 99 )); then
            echo "::error title=Invalid version::minor and patch must be 0..99 for version_code encoding"
            exit 1
          fi
          version_code=$(( 10#${major} * 10000 + 10#${minor} * 100 + 10#${patch} ))
          if (( version_code < 0 || version_code > 4294967295 )); then
            echo "::error title=Invalid version::version_code overflows u32 for ${version_name}"
            exit 1
          fi

          if [[ -z "${INPUT_VERSION_NAME:-}" && "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]]; then
            version_name="${version_name}-nightly.${build_number}"
          fi

          echo "version_name=${version_name}" >> "$GITHUB_OUTPUT"
          echo "version_code=${version_code}" >> "$GITHUB_OUTPUT"
          echo "build_number=${build_number}" >> "$GITHUB_OUTPUT"
          echo "固件版本: v${version_name} (code ${version_code}, build ${build_number})"

      - name: Configure (CMake + Ninja)
        shell: bash
        run: |
          set -euo pipefail
          cmake -S "${CMAKE_PROJECT_DIR}" -B "${BUILD_DIR}" \
            -G Ninja -DCMAKE_BUILD_TYPE="${BUILD_TYPE}" \
            -DCMAKE_OBJECT_PATH_MAX=1024

      - name: Build firmware
        shell: bash
        run: |
          set -euo pipefail
          cmake --build "${BUILD_DIR}" --target X_Track_App_GCC X_Track_Boot --parallel

      - name: Run host tests (boot vectors, OTA host tests, P3-1 product regressions)
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/boot/test_fw_header_vectors.py
          python3 tests/boot/test_boot_protocols.py
          python3 tests/boot/test_boot_state_machine.py
          python3 tests/ota/test_ota_staging.py
          python3 tests/ota/test_ota_package.py
          python3 tests/ota/test_ota_patch.py
          python3 tests/ota/test_ota_ble_frame.py
          python3 tests/ota/test_ota_ble_session.py
          python3 -B tests/ota/test_ota_ble_contract.py
          python3 tests/ota/p3_1_verify_text_isolation.py
          python3 tests/ota/p3_1_verify_portability.py
          python3 tests/ota/test_ota_device_info.py
          python3 -I -S -B -X utf8 Tools/ota/p34-acceptance/selftest.py admission --out "$GITHUB_WORKSPACE/.cache/p34-admission-tests"
          python3 -I -S -B -X utf8 tests/ota/test_hardware_serial.py --metrics --out "$GITHUB_WORKSPACE/.cache/p34-uart-metrics-tests"

      - name: Validate OTA App layout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import os
          import re
          from pathlib import Path

          layout_text = Path("Libraries/OTA/ota_layout.h").read_text(encoding="ascii")

          def macro(name):
              match = re.search(
                  rf"(?m)^\s*#define\s+{re.escape(name)}\s+(0x[0-9A-Fa-f]+|[0-9]+)\b",
                  layout_text,
              )
              if not match:
                  raise SystemExit(f"layout macro missing: {name}")
              return int(match.group(1), 0)

          app_origin = macro("OTA_APP_ORIGIN")
          app_length = macro("OTA_APP_LENGTH")
          header_offset = macro("OTA_FW_HEADER_OFFSET")
          header_size = macro("OTA_FW_HEADER_SIZE")
          vector_max = macro("OTA_VECTOR_MAX")
          ram_origin = macro("OTA_RAM_ORIGIN")
          ram_length = macro("OTA_RAM_LENGTH")
          overlay_origin = macro("OTA_OVERLAY_ORIGIN")
          overlay_length = macro("OTA_OVERLAY_LENGTH")
          workspace_length = macro("OTA_OVERLAY_WORKSPACE_LENGTH")
          evidence_size = macro("OTA_VTOR_EVIDENCE_SIZE")

          output_dir = Path(os.environ["BUILD_DIR"]) / "app-gcc"
          map_text = (output_dir / "X-Track-App-GCC.map").read_text(
              encoding="utf-8", errors="replace"
          )
          linker_text = (output_dir / "x-track-app-gcc.ld").read_text(
              encoding="utf-8", errors="strict"
          )
          raw_bin = (output_dir / "X-Track-App-GCC.bin").read_bytes()

          def map_region(name):
              match = re.search(
                  rf"(?m)^{re.escape(name)}\s+(0x[0-9A-Fa-f]+)\s+(0x[0-9A-Fa-f]+)\s+",
                  map_text,
              )
              if not match:
                  raise SystemExit(f"map region missing: {name}")
              return tuple(int(value, 16) for value in match.groups())

          def map_section(name):
              match = re.search(
                  rf"(?m)^{re.escape(name)}\s+(0x[0-9A-Fa-f]+)\s+(0x[0-9A-Fa-f]+)",
                  map_text,
              )
              if not match:
                  raise SystemExit(f"map section missing: {name}")
              return tuple(int(value, 16) for value in match.groups())

          if map_region("FLASH") != (app_origin, app_length):
              raise SystemExit("A1: FLASH region mismatch")
          if map_region("RAM") != (ram_origin, ram_length):
              raise SystemExit("A7: RAM region mismatch")
          if map_region("RW_IRAM2") != (overlay_origin, overlay_length):
              raise SystemExit("A7: overlay region mismatch")

          vector = map_section(".isr_vector")
          header = map_section(".fw_header")
          evidence = map_section(".ota_vtor_noinit")
          overlay = map_section(".sram_ext")
          ota_overlay = map_section(".ota_overlay")
          if vector[0] != app_origin or vector[1] > vector_max:
              raise SystemExit("A3: vector placement/size mismatch")
          if header != (app_origin + header_offset, header_size):
              raise SystemExit("A4: firmware header placement/size mismatch")
          if evidence[1] < evidence_size:
              raise SystemExit("A6: VTOR evidence section too small")
          if not (ram_origin <= evidence[0] and evidence[0] + evidence[1] <= ram_origin + ram_length):
              raise SystemExit("A6: VTOR evidence section escaped main RAM")
          if overlay != (overlay_origin, overlay_length):
              raise SystemExit("A7: overlay section mismatch")
          if ota_overlay != (overlay_origin, workspace_length):
              raise SystemExit("A7: OTA workspace overlay mismatch")
          if "g_ota_vtor_actual" not in map_text or "g_ota_vtor_expected" not in map_text:
              raise SystemExit("A6: VTOR evidence symbols missing")

          linker_flash = re.search(
              r"FLASH\s+\(rx\)\s*:\s*ORIGIN\s*=\s*(0x[0-9A-Fa-f]+)\s*,\s*LENGTH\s*=\s*(0x[0-9A-Fa-f]+)",
              linker_text,
          )
          if not linker_flash or tuple(int(value, 16) for value in linker_flash.groups()) != (
              app_origin,
              app_length,
          ):
              raise SystemExit("A1: preprocessed linker MEMORY mismatch")
          if "ASSERT(SIZEOF(.isr_vector) <= " not in linker_text:
              raise SystemExit("A3: vector size ASSERT missing")

          header_bytes = raw_bin[header_offset:header_offset + header_size]
          if len(header_bytes) != header_size or header_bytes != bytes([0xFF]) * header_size:
              raise SystemExit("A5: raw firmware header is not the placeholder")
          if len(raw_bin) > app_length:
              raise SystemExit("A5: raw App image exceeds contracted Flash length")

          prefix_sha = hashlib.sha256(raw_bin[:header_offset]).hexdigest()
          print(
              "OTA_LAYOUT_ASSERTIONS=PASS "
              f"flash={app_origin:#010x}/{app_length:#x} "
              f"vector={vector[0]:#010x}/{vector[1]:#x} "
              f"header={header[0]:#010x}/{header[1]} "
              f"raw_prefix_sha256={prefix_sha}"
          )
          PY

      - name: Validate OTA Boot skeleton
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/boot/validate_boot_artifact.py --build-dir "${BUILD_DIR}"
          python3 tests/boot/validate_boot_handoff.py --build-dir "${BUILD_DIR}"

      - name: Report firmware artifacts
        id: artifacts
        shell: bash
        run: |
          set -euo pipefail
          cd "${BUILD_DIR}/app-gcc"

          arm-none-eabi-size --format=berkeley X-Track-App-GCC.elf

          sha256="$(sha256sum X-Track-App-GCC.bin | awk '{print $1}')"
          bin_size="$(stat -c%s X-Track-App-GCC.bin)"
          echo "sha256=${sha256}" >> "$GITHUB_OUTPUT"
          echo "bin_size=${bin_size}" >> "$GITHUB_OUTPUT"
          echo "X-Track-App-GCC.bin: ${bin_size} bytes, sha256=${sha256}"

      - name: Bind same-run GCC App and Boot inputs
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          set -euo pipefail
          node .github/scripts/firmware-release.mjs capture \
            --app "$BUILD_DIR/app-gcc/X-Track-App-GCC.bin" \
            --boot "$BUILD_DIR/boot/X-Track-Boot.bin" \
            --version "${VERSION_NAME%%-*}" --commit "$GITHUB_SHA" \
            --build-timestamp "$(git show -s --format=%ct "$GITHUB_SHA")" \
            --output "$BUILD_DIR/app-gcc/gcc-build-inputs.json"

      - name: Exercise production preparation on the real GCC build (development key only)
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/firmware-release.mjs development \
            --app "$BUILD_DIR/app-gcc/X-Track-App-GCC.bin" \
            --boot "$BUILD_DIR/boot/X-Track-Boot.bin" \
            --build-inputs "$BUILD_DIR/app-gcc/gcc-build-inputs.json" \
            --output-dir .cache/gcc-development

      - name: Preserve non-publishable GCC packaging evidence
        uses: actions/upload-artifact@v4
        with:
          name: p41-gcc-development-${{ github.sha }}
          path: .cache/gcc-development/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

      - name: Exercise the shared key-bound GCC build without protected credentials
        id: keyed_development
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          set -euo pipefail
          cleanup_key() {
            result=$?
            trap - EXIT
            node .github/scripts/firmware-gcc-keyed-build.mjs cleanup --build-dir .cache/keyed-development-build || result=1
            exit "$result"
          }
          trap cleanup_key EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          node .github/scripts/firmware-gcc-keyed-build.mjs --development \
            --build-dir .cache/keyed-development-build --evidence-dir .cache/keyed-development/build \
            --version "${VERSION_NAME%%-*}"
          node .github/scripts/firmware-release.mjs development \
            --app .cache/keyed-development/build/app/X-Track-App-GCC.bin \
            --boot .cache/keyed-development/build/boot/X-Track-Boot.bin \
            --build-inputs .cache/keyed-development/build/gcc-build-inputs.json \
            --output-dir .cache/keyed-development/prepared

      - name: Check development key cleanup before archiving
        id: keyed_development_cleanup
        if: always() && steps.keyed_development.outcome != 'skipped' && steps.keyed_development.outcome != ''
        run: node .github/scripts/firmware-gcc-keyed-build.mjs cleanup --build-dir .cache/keyed-development-build

      - name: Preserve non-publishable key-bound build and packaging evidence
        if: always() && steps.keyed_development_cleanup.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: p41-keyed-development-${{ github.sha }}
          path: .cache/keyed-development/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

      - name: Build the P3-4 acceptance candidate
        id: p34_candidate
        if: github.event_name == 'pull_request' && github.head_ref == 'acceptance/p3-4-v2-20261009'
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(dirname "$(dirname "$(command -v arm-none-eabi-gcc)")")"
          python3 -I -S -B -X utf8 Tools/ota/p34-acceptance/build.py candidate \
            --out "$GITHUB_WORKSPACE/.cache/p34-ci" --toolchain "$toolchain"

      - name: Preserve the P3-4 candidate build evidence
        if: always() && steps.p34_candidate.outcome != 'skipped' && github.event_name == 'pull_request' && github.head_ref == 'acceptance/p3-4-v2-20261009'
        uses: actions/upload-artifact@v4
        with:
          name: p34-candidate-${{ github.event.pull_request.head.sha }}
          path: |
            .cache/p34-ci/*.json
            .cache/p34-ci/*.log
            .cache/p34-ci/b/app-gcc/X-Track-App-GCC.bin
            .cache/p34-ci/b/app-gcc/X-Track-App-GCC.elf
            .cache/p34-ci/b/app-gcc/X-Track-App-GCC.hex
            .cache/p34-ci/b/app-gcc/X-Track-App-GCC.map
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ steps.version.outputs.version_name }}
          path: |
            ${{ env.BUILD_DIR }}/app-gcc/X-Track-App-GCC.bin
            ${{ env.BUILD_DIR }}/app-gcc/X-Track-App-GCC.hex
            ${{ env.BUILD_DIR }}/app-gcc/X-Track-App-GCC.elf
            ${{ env.BUILD_DIR }}/app-gcc/X-Track-App-GCC.map
            ${{ env.BUILD_DIR }}/app-gcc/gcc-build-inputs.json
          retention-days: 14
          if-no-files-found: error

      # Keep the App artifact rooted at app-gcc/ so the gated release job's
      # existing firmware-release-assets/X-Track-App-GCC.bin path stays stable.
      - name: Upload Boot artifact
        uses: actions/upload-artifact@v4
        with:
          name: boot-${{ steps.version.outputs.version_name }}
          path: |
            ${{ env.BUILD_DIR }}/boot/X-Track-Boot.bin
            ${{ env.BUILD_DIR }}/boot/X-Track-Boot.hex
            ${{ env.BUILD_DIR }}/boot/X-Track-Boot.elf
            ${{ env.BUILD_DIR }}/boot/X-Track-Boot.map
          retention-days: 14
          if-no-files-found: error


  check-firmware-bindings:
    name: Isolated firmware binding qualification (not rehearsal)
    runs-on: ubuntu-latest
    needs: [release-development-checks]
    timeout-minutes: 10
    if: >-
      github.event_name == 'workflow_dispatch' && github.event.inputs.check_bindings == 'true' && github.event.inputs.publish != 'true' && github.event.inputs.rehearsal != 'true'
    environment: firmware-rehearsal
    permissions:
      contents: read
    steps:
      - name: Enforce check-only locked-gate reviewed identity
        id: gate
        shell: bash
        env:
          OTA_BOOT_CHAIN_READY: ${{ vars.OTA_BOOT_CHAIN_READY }}
          INPUT_CHECK_BINDINGS: ${{ github.event.inputs.check_bindings }}
          INPUT_PUBLISH: ${{ github.event.inputs.publish }}
          INPUT_REHEARSAL: ${{ github.event.inputs.rehearsal }}
          FIRMWARE_REHEARSAL_BINDINGS_CHECK_COMMIT: ${{ vars.FIRMWARE_REHEARSAL_BINDINGS_CHECK_COMMIT }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" || "$INPUT_CHECK_BINDINGS" != "true" || "$INPUT_PUBLISH" != "false" || "$INPUT_REHEARSAL" != "false" || "$OTA_BOOT_CHAIN_READY" != "false" ]]; then
            echo "::error::Binding qualification requires an explicit check-only dispatch with the gate locked"
            exit 2
          fi
          if [[ "$GITHUB_REPOSITORY" != "Eitan-S-23/E-Track" || ! "$FIRMWARE_REHEARSAL_BINDINGS_CHECK_COMMIT" =~ ^[0-9a-f]{40}$ || "$GITHUB_SHA" != "$FIRMWARE_REHEARSAL_BINDINGS_CHECK_COMMIT" ]]; then
            echo "::error::Binding qualification requires the exact protected reviewed source commit"
            exit 2
          fi

      - name: Checkout the exact reviewed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install pinned runtime dependencies without credentials
        shell: bash
        env:
          npm_config_cache: ${{ github.workspace }}/.cache/bindings-npm
        run: npm ci --prefix app/bluetooth_flutter_Trace/cloudflare/update-service/worker --registry=https://registry.npmjs.org --replace-registry-host=always

      - name: Read existing objects and D1 through the shared runtime
        id: bindings_check
        timeout-minutes: 5
        shell: bash
        env:
          INPUT_CHECK_BINDINGS: ${{ github.event.inputs.check_bindings }}
          INPUT_PUBLISH: ${{ github.event.inputs.publish }}
          INPUT_REHEARSAL: ${{ github.event.inputs.rehearsal }}
          OTA_BOOT_CHAIN_READY: ${{ vars.OTA_BOOT_CHAIN_READY }}
          FIRMWARE_REHEARSAL_BINDINGS_CHECK_COMMIT: ${{ vars.FIRMWARE_REHEARSAL_BINDINGS_CHECK_COMMIT }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.FIRMWARE_REHEARSAL_CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.FIRMWARE_REHEARSAL_CLOUDFLARE_API_TOKEN }}
          TRACE_UPDATE_SERVICE_URL: ${{ secrets.FIRMWARE_REHEARSAL_TRACE_UPDATE_SERVICE_URL }}
          TRACE_R2_BUCKET: ${{ vars.FIRMWARE_REHEARSAL_TRACE_R2_BUCKET }}
          TRACE_D1_DATABASE_ID: ${{ vars.FIRMWARE_REHEARSAL_TRACE_D1_DATABASE_ID }}
          TRACE_D1_DATABASE_NAME: ${{ vars.FIRMWARE_REHEARSAL_TRACE_D1_DATABASE_NAME }}
        run: node .github/scripts/firmware-bindings-check.mjs --output .cache/bindings-check/result.json

      - name: Preserve binding qualification result (not approval or rehearsal)
        if: success() && steps.bindings_check.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: p41-bindings-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/bindings-check/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

  rehearse-cloudflare:
    name: Firmware rehearsal (shared release implementation)
    runs-on: ubuntu-latest
    needs: [build, release-development-checks]
    if: >-
      github.event_name == 'workflow_dispatch' && github.event.inputs.rehearsal == 'true' && github.event.inputs.publish != 'true'
    environment: firmware-rehearsal
    permissions:
      contents: read
      actions: read
    steps:
      - name: Enforce isolated locked-gate rehearsal
        id: gate
        shell: bash
        env:
          OTA_BOOT_CHAIN_READY: ${{ vars.OTA_BOOT_CHAIN_READY }}
          INPUT_PUBLISH: ${{ github.event.inputs.publish }}
          INPUT_REHEARSAL: ${{ github.event.inputs.rehearsal }}
          INPUT_CHECK_BINDINGS: ${{ github.event.inputs.check_bindings }}
          INPUT_APPROVED_REHEARSAL_RUN_ID: ${{ github.event.inputs.approved_rehearsal_run_id }}
          OTA_APPROVED_REHEARSAL_RUN_ID: ${{ vars.OTA_APPROVED_REHEARSAL_RUN_ID }}
          OTA_APPROVED_REHEARSAL_ATTEMPT: ${{ vars.OTA_APPROVED_REHEARSAL_ATTEMPT }}
        run: |
          set -euo pipefail
          if [[ "$OTA_BOOT_CHAIN_READY" != "false" || "$INPUT_PUBLISH" == "true" || "$INPUT_CHECK_BINDINGS" == "true" ]]; then
            echo "::error::Rehearsal requires the locked boot-chain gate and must not request production"
            exit 1
          fi
          if (( GITHUB_RUN_ATTEMPT > 1 )); then
            echo "reference_run_id=$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
            echo "reference_attempt=$((GITHUB_RUN_ATTEMPT - 1))" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout the exact build revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install the same GCC toolchain for the protected key-bound build
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: "13.3.Rel1"

      - name: Download immutable rehearsal reference when required
        if: steps.gate.outputs.reference_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: p41-rehearsal-${{ steps.gate.outputs.reference_run_id }}-${{ steps.gate.outputs.reference_attempt }}
          run-id: ${{ steps.gate.outputs.reference_run_id }}
          github-token: ${{ github.token }}
          path: .cache/reference

      - name: Install pinned packaging dependencies without release secrets
        shell: bash
        env:
          npm_config_cache: ${{ github.workspace }}/.cache/release-npm
          PIP_CACHE_DIR: ${{ github.workspace }}/.cache/release-pip
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pycryptodome==3.23.0
          npm ci --prefix app/bluetooth_flutter_Trace/cloudflare/update-service/worker --registry=https://registry.npmjs.org --replace-registry-host=always
          cmake -S .github/scripts/bsdiff -B .cache/bsdiff -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build .cache/bsdiff --target bsdiff

      - name: Build matching GCC inputs with the protected packaging key
        id: keyed_build
        timeout-minutes: 15
        shell: bash
        env:
          FIRMWARE_RELEASE_MODE: rehearsal
          INPUT_PUBLISH: ${{ github.event.inputs.publish }}
          INPUT_REHEARSAL: ${{ github.event.inputs.rehearsal }}
          INPUT_CHECK_BINDINGS: ${{ github.event.inputs.check_bindings }}
          OTA_BOOT_CHAIN_READY: ${{ vars.OTA_BOOT_CHAIN_READY }}
          OTA_AES_KEY: ${{ secrets.FIRMWARE_REHEARSAL_OTA_AES_KEY }}
          RELEASE_VERSION: ${{ needs.build.outputs.version_name }}
        run: |
          set -euo pipefail
          cleanup_key() {
            result=$?
            trap - EXIT
            node .github/scripts/firmware-gcc-keyed-build.mjs cleanup --build-dir .cache/release-gcc || result=1
            exit "$result"
          }
          trap cleanup_key EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          node .github/scripts/firmware-gcc-keyed-build.mjs \
            --build-dir .cache/release-gcc --evidence-dir .cache/release/keyed-build --version "$RELEASE_VERSION"

      - name: Run the shared finalize verify upload register pipeline
        id: release_execute
        shell: bash
        env:
          FIRMWARE_RELEASE_MODE: rehearsal
          INPUT_CHECK_BINDINGS: ${{ github.event.inputs.check_bindings }}
          INPUT_PUBLISH: ${{ github.event.inputs.publish }}
          INPUT_REHEARSAL: ${{ github.event.inputs.rehearsal }}
          INPUT_RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
          RELEASE_VERSION: ${{ needs.build.outputs.version_name }}
          INPUT_APPROVED_REHEARSAL_RUN_ID: ${{ github.event.inputs.approved_rehearsal_run_id }}
          OTA_BOOT_CHAIN_READY: ${{ vars.OTA_BOOT_CHAIN_READY }}
          OTA_APPROVED_REHEARSAL_RUN_ID: ${{ vars.OTA_APPROVED_REHEARSAL_RUN_ID }}
          OTA_APPROVED_REHEARSAL_ATTEMPT: ${{ vars.OTA_APPROVED_REHEARSAL_ATTEMPT }}
          OTA_APPROVED_REHEARSAL_METADATA_SHA256: ${{ vars.OTA_APPROVED_REHEARSAL_METADATA_SHA256 }}
          OTA_APPROVED_REHEARSAL_EVIDENCE_SHA256: ${{ vars.OTA_APPROVED_REHEARSAL_EVIDENCE_SHA256 }}
          OTA_PREVIOUS_RELEASE_JSON: ${{ vars.OTA_PREVIOUS_RELEASE_JSON }}
          OTA_APPROVED_BOOTSTRAP_BASELINE_SHA256: ${{ vars.OTA_APPROVED_BOOTSTRAP_BASELINE_SHA256 }}
          TRACE_FIRMWARE_MIN_APP_VERSION_CODE: ${{ vars.TRACE_FIRMWARE_MIN_APP_VERSION_CODE }}
          TRACE_FIRMWARE_MIN_PROTOCOL_VERSION: ${{ vars.TRACE_FIRMWARE_MIN_PROTOCOL_VERSION }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.FIRMWARE_REHEARSAL_CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.FIRMWARE_REHEARSAL_CLOUDFLARE_API_TOKEN }}
          TRACE_UPDATE_SERVICE_URL: ${{ secrets.FIRMWARE_REHEARSAL_TRACE_UPDATE_SERVICE_URL }}
          TRACE_DEPLOY_TOKEN: ${{ secrets.FIRMWARE_REHEARSAL_TRACE_DEPLOY_TOKEN }}
          OTA_AES_KEY: ${{ secrets.FIRMWARE_REHEARSAL_OTA_AES_KEY }}
          TRACE_R2_BUCKET: ${{ vars.FIRMWARE_REHEARSAL_TRACE_R2_BUCKET }}
          TRACE_D1_DATABASE_ID: ${{ vars.FIRMWARE_REHEARSAL_TRACE_D1_DATABASE_ID }}
          TRACE_D1_DATABASE_NAME: ${{ vars.FIRMWARE_REHEARSAL_TRACE_D1_DATABASE_NAME }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          reference=()
          if [[ -d .cache/reference ]]; then reference=(--reference-dir .cache/reference); fi
          node .github/scripts/firmware-release.mjs execute \
            --app .cache/release/keyed-build/app/X-Track-App-GCC.bin \
            --boot .cache/release/keyed-build/boot/X-Track-Boot.bin \
            --build-inputs .cache/release/keyed-build/gcc-build-inputs.json \
            --output-dir .cache/release/prepared \
            --bsdiff "$GITHUB_WORKSPACE/.cache/bsdiff/bin/bsdiff" "${reference[@]}"

      - name: Check private key cleanup before archiving
        id: key_cleanup
        if: always() && steps.keyed_build.outcome != 'skipped' && steps.keyed_build.outcome != ''
        run: node .github/scripts/firmware-gcc-keyed-build.mjs cleanup --build-dir .cache/release-gcc

      - name: Preserve release attempt originals (not an approval)
        if: always() && steps.key_cleanup.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: p41-rehearsal-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/release/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

  register-cloudflare:
    name: Firmware production (shared release implementation)
    runs-on: ubuntu-latest
