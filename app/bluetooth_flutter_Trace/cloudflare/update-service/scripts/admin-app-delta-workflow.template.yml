name: Original App Selected Delta Packages
run-name: ${{ github.event_name == 'push' && 'Original App delta public key' || format('delta:{0}:{1}', inputs.job_id, inputs.attempt) }}
on:
  push:
    branches: ["dev/admin/original-delta-*"]
  workflow_dispatch:
    inputs:
      job_id:
        description: "Immutable original-Admin App delta job"
        type: string
        required: true
      attempt:
        description: "Exact Admin attempt; do not use GitHub rerun"
        type: string
        required: true
      kind:
        type: choice
        options: [android]
        required: true
permissions:
  contents: read
concurrency:
  group: original-app-delta-${{ inputs.job_id || github.ref }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: "1"
  NODE_DISABLE_COMPILE_CACHE: "1"
  TMPDIR: ${{ github.workspace }}/.cache/tmp
  TMP: ${{ github.workspace }}/.cache/tmp
  TEMP: ${{ github.workspace }}/.cache/tmp
jobs:
  public-key:
    if: github.repository == 'Eitan-S-23/Trace' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Export only the existing original-App public key
        env:
          PUBLIC_KEY_BASE64: ${{ secrets.TRACE_UPDATE_PAYLOAD_ED25519_PUBLIC_KEY_BASE64 }}
        run: |
          mkdir -p "$TMPDIR" .cache/admin-delta
          node --input-type=module - <<'JS'
          import { createHash } from 'node:crypto';
          const key=Buffer.from(process.env.PUBLIC_KEY_BASE64 || '', 'base64');
          if(key.length!==32) throw new Error('Original App public key is unavailable');
          process.stdout.write('TRACE_DELTA_PUBLIC_KEY '+JSON.stringify({
            publicKeyHex:key.toString('hex'),sha256:createHash('sha256').update(key).digest('hex'),
            sourceCommit:process.env.GITHUB_SHA,generatorCommit:'__DELTA_SOURCE_COMMIT__',privateKeyExported:false
          })+'\n');
          JS
  android:
    if: github.repository == 'Eitan-S-23/Trace' && github.event_name == 'workflow_dispatch' && inputs.kind == 'android'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out only the reviewed generator source
        uses: actions/checkout@v4
        with:
          repository: Eitan-S-23/E-Track
          ref: __DELTA_SOURCE_COMMIT__
          path: .cache/delta-source
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Prepare a project-local xdelta3 executable
        run: |
          mkdir -p "$TMPDIR" .cache/delta-source/.cache/admin-delta/tools
          cd .cache/delta-source/.cache/admin-delta/tools
          apt-get download xdelta3
          for package in ./*.deb; do dpkg-deb -x "$package" .; done
          echo "$GITHUB_WORKSPACE/.cache/delta-source/.cache/admin-delta/tools/usr/bin" >> "$GITHUB_PATH"
      - name: Generate, reconstruct and sign with the original App credentials
        id: generate
        working-directory: .cache/delta-source
        env:
          INPUT_JOB_ID: ${{ inputs.job_id }}
          INPUT_ATTEMPT: ${{ inputs.attempt }}
          INPUT_KIND: android
          TRACE_UPDATE_SERVICE_URL: https://trace-update-service-staging.tangjichentudou.workers.dev
          TRACE_DEPLOY_TOKEN: ${{ secrets.TRACE_DEPLOY_TOKEN }}
          TRACE_UPDATE_PAYLOAD_ED25519_PRIVATE_KEY_BASE64: ${{ secrets.TRACE_UPDATE_PAYLOAD_ED25519_PRIVATE_KEY_BASE64 }}
          TRACE_UPDATE_PAYLOAD_KEY_VERSION: ${{ vars.TRACE_UPDATE_PAYLOAD_KEY_VERSION || 'staging' }}
        run: node app/bluetooth_flutter_Trace/cloudflare/update-service/scripts/generate-delta-job.mjs --out .cache/admin-delta/run
      - name: Preserve bounded receipts; verified delta already resides in R2
        if: always() && steps.generate.outcome != 'skipped'
        run: |
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import {existsSync,readFileSync,statSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import path from 'node:path';
          const out=process.env.DELTA_RECEIPTS_DIR || '.cache/delta-source/.cache/admin-delta/run';
          const receipts={};
          for(const name of ['job.json','claim.json','steps.json','proof.json','upload.json','complete.json','failure.json']) {
            const file=path.join(out,name);
            if(!existsSync(file)) continue;
            assert(statSync(file).size<=65536,'Oversized delta receipt');
            const raw=readFileSync(file),value=JSON.parse(raw);
            receipts[name]=value;
            process.stdout.write('TRACE_DELTA_RECEIPT '+JSON.stringify({name,sha256:createHash('sha256').update(raw).digest('hex'),value})+'\n');
          }
          const complete=receipts['complete.json'];
          if(complete) {
            const proof=receipts['proof.json'];
            assert(proof && receipts['job.json'] && receipts['upload.json']);
            const patch=readFileSync(path.join(out,'patch'));
            assert.equal(createHash('sha256').update(patch).digest('hex'),proof.sha256);
            assert.equal(patch.length,proof.sizeBytes);
            assert.equal(complete.job?.status,'ready');assert.equal(complete.job.enabled,false);
            assert.equal(complete.job.sha256,proof.sha256);assert.equal(complete.channelPublished,false);
          }
          JS
